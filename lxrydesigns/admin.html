<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0D0D0D">
    <title>Operations Dashboard | LXRY Designs</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        /* ---- LXRY brand pack tokens (see brand-pack.html) ---- */
        :root {
            color-scheme: dark;
            --black: #000000;
            --dark-bg: #0D0D0D;
            --panel: #0F1514;
            --panel-2: #121A19;
            --border: #20302D;
            --border-soft: #182420;
            --teal: #00A19B;
            --turq: #27F4D2;
            --silver: #C8CCCE;
            --gray: #565F64;
            --white: #FFFFFF;
            --text: #E9EDEC;
            --text-dim: #8C9694;
            --danger: #FF6B6B;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --jura: 'Jura', 'Inter', sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }

        [hidden] { display: none !important; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            background:
                radial-gradient(120% 80% at 85% -10%, rgba(39, 244, 210, .10), transparent 60%),
                radial-gradient(90% 70% at 5% 0%, rgba(39, 244, 210, .05), transparent 55%),
                var(--dark-bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--turq);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0);
            white-space: nowrap; border: 0;
        }

        /* ---- header ---- */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px clamp(16px, 4vw, 40px);
            background: rgba(13, 13, 13, .92);
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            min-width: 0;
        }

        .brand-mark {
            height: 44px;
            width: auto;
            display: block;
            filter: drop-shadow(0 4px 18px rgba(39, 244, 210, .22));
        }

        .brand-words {
            display: flex;
            flex-direction: column;
            line-height: 1;
            min-width: 0;
        }

        .brand-name {
            font-family: var(--jura);
            font-weight: 600;
            font-size: 20px;
            letter-spacing: .15em;
            color: var(--turq);
        }

        .brand-title {
            font-family: var(--jura);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--white);
            margin: 7px 0 0;
        }

        .btn {
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .06em;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            transition: background-color .15s, border-color .15s, color .15s, opacity .15s;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover { border-color: var(--turq); color: var(--turq); }

        .btn-primary {
            background: var(--turq);
            color: var(--black);
            border: 1px solid var(--turq);
            width: 100%;
            padding: 13px 18px;
            font-size: 14px;
        }

        .btn-primary:hover { background: #5ff7de; }

        .btn[disabled] { opacity: .55; cursor: progress; }

        /* ---- layout ---- */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(28px, 6vw, 56px) clamp(16px, 4vw, 40px);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: clamp(20px, 4vw, 32px);
        }

        /* ---- login ---- */
        .login {
            max-width: 420px;
            margin: clamp(24px, 8vh, 80px) auto 0;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: .32em;
            text-transform: uppercase;
            color: var(--turq);
            font-weight: 600;
            margin: 0 0 12px;
        }

        .login h1 {
            font-family: var(--jura);
            font-weight: 600;
            font-size: 24px;
            letter-spacing: .06em;
            margin: 0 0 8px;
            color: var(--text);
        }

        .login .lede {
            margin: 0 0 24px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            font-family: var(--mono);
            font-size: 16px; /* >=16px prevents iOS zoom on focus */
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            transition: border-color .15s;
        }

        .field input:focus { border-color: var(--turq); outline: none; }

        .field input[aria-invalid="true"] { border-color: var(--danger); }

        .form-error {
            min-height: 1.4em;
            margin: 0 0 14px;
            font-size: 13px;
            color: var(--danger);
        }

        /* ---- dashboard shells (filled by later tasks) ---- */
        .dash-section + .dash-section { margin-top: 32px; }

        .sec-head {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 16px;
        }

        .sec-head h2 {
            font-size: 13px;
            letter-spacing: .24em;
            text-transform: uppercase;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }

        .sec-head .rule {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
            min-width: 40px;
        }

        @media (max-width: 480px) {
            .brand-mark { height: 36px; }
            .brand-name { font-size: 17px; }
            .brand-title { font-size: 10px; letter-spacing: .22em; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <a class="brand" href="/admin" aria-label="LXRY Designs Operations Dashboard">
            <img src="assets/lxry-mark-solid.png" alt="" class="brand-mark">
            <span class="brand-words">
                <span class="brand-name">LXRY</span>
                <span class="brand-title">Operations Dashboard</span>
            </span>
        </a>
        <button type="button" id="logout-btn" class="btn btn-ghost" hidden>Log out</button>
    </header>

    <main>
        <!-- Password form: shown when there is no valid session -->
        <section id="login-section" class="login panel" aria-labelledby="login-title" hidden>
            <p class="eyebrow">Restricted</p>
            <h1 id="login-title">Sign in</h1>
            <p class="lede">Enter the admin password to review and publish this week's content.</p>
            <form id="login-form" novalidate>
                <div class="field">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" name="password"
                           autocomplete="current-password" required
                           aria-describedby="login-error">
                </div>
                <p id="login-error" class="form-error" role="alert" aria-live="assertive"></p>
                <button type="submit" id="login-submit" class="btn btn-primary">Unlock dashboard</button>
            </form>
        </section>

        <!-- Dashboard: hidden until authenticated. Content rendered in later tasks. -->
        <section id="dashboard" class="dash-section" aria-label="Current draft" hidden></section>

        <!-- Publish history: hidden until authenticated. Content rendered in later tasks. -->
        <section id="publish-history" class="dash-section" aria-label="Publish history" hidden></section>
    </main>

    <script>
    (function () {
        'use strict';

        var SESSION_KEY = 'admin_session';
        var SESSION_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 days
        var AUTH_ENDPOINT = '/admin-check-password';

        var loginSection = document.getElementById('login-section');
        var loginForm = document.getElementById('login-form');
        var passwordInput = document.getElementById('admin-password');
        var loginError = document.getElementById('login-error');
        var loginSubmit = document.getElementById('login-submit');
        var logoutBtn = document.getElementById('logout-btn');
        var dashboard = document.getElementById('dashboard');
        var publishHistory = document.getElementById('publish-history');

        // ---- session storage helpers ----

        function readSession() {
            var raw;
            try {
                raw = window.localStorage.getItem(SESSION_KEY);
            } catch (e) {
                return null; // storage blocked (private mode, disabled cookies)
            }
            if (!raw) return null;
            try {
                var s = JSON.parse(raw);
                if (!s || typeof s.token !== 'string' || !s.token ||
                    typeof s.timestamp !== 'number' || typeof s.ttl !== 'number') {
                    return null;
                }
                return s;
            } catch (e) {
                return null; // corrupted value
            }
        }

        function isSessionValid(s) {
            return !!s && (s.timestamp + s.ttl) > Date.now();
        }

        function saveSession(token) {
            var session = { token: token, timestamp: Date.now(), ttl: SESSION_TTL_MS };
            try {
                window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
            } catch (e) {
                // Storage unavailable: session lasts for this page view only.
            }
            return session;
        }

        function clearSession() {
            try {
                window.localStorage.removeItem(SESSION_KEY);
            } catch (e) { /* ignore */ }
        }

        // Returns the current valid token, or null. Clears an expired/corrupt session.
        function getSessionToken() {
            var s = readSession();
            if (isSessionValid(s)) return s.token;
            clearSession();
            return null;
        }

        // ---- view switching ----

        function showLogin() {
            dashboard.hidden = true;
            publishHistory.hidden = true;
            logoutBtn.hidden = true;
            loginSection.hidden = false;
            passwordInput.focus();
        }

        function showDashboard() {
            loginSection.hidden = true;
            dashboard.hidden = false;
            publishHistory.hidden = false;
            logoutBtn.hidden = false;
            // Hook for later tasks (draft rendering, history, polling).
            if (typeof window.onAdminAuthenticated === 'function') {
                window.onAdminAuthenticated(getSessionToken());
            }
        }

        function setError(message) {
            loginError.textContent = message || '';
            passwordInput.setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        // ---- login ----

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();
            var password = passwordInput.value;

            if (!password) {
                setError('Enter the password.');
                passwordInput.focus();
                return;
            }

            setError('');
            loginSubmit.disabled = true;
            loginSubmit.textContent = 'Checking...';

            fetch(AUTH_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password }),
                credentials: 'same-origin'
            })
                .then(function (res) {
                    return res.json()
                        .catch(function () { return {}; })
                        .then(function (data) { return { status: res.status, data: data }; });
                })
                .then(function (result) {
                    var data = result.data || {};
                    if (result.status === 200 && data.valid === true &&
                        typeof data.token === 'string' && data.token) {
                        saveSession(data.token);
                        passwordInput.value = '';
                        showDashboard();
                    } else if (result.status === 401 || data.valid === false) {
                        setError('Incorrect password');
                        passwordInput.select();
                    } else {
                        setError('Sign-in failed (server error ' + result.status + '). Try again.');
                    }
                })
                .catch(function () {
                    setError('Could not reach the server. Check your connection and try again.');
                })
                .then(function () {
                    loginSubmit.disabled = false;
                    loginSubmit.textContent = 'Unlock dashboard';
                });
        });

        // ---- logout ----

        logoutBtn.addEventListener('click', function () {
            clearSession();
            window.location.href = '/admin';
        });

        // Expose a minimal session API for later tasks (dashboard fetches, polling).
        window.adminSession = {
            getToken: getSessionToken,
            clear: clearSession,
            logout: function () {
                clearSession();
                window.location.href = '/admin';
            }
        };

        // ---- initial state ----

        if (getSessionToken()) {
            showDashboard();
        } else {
            showLogin();
        }
    })();
    </script>
</body>
</html>
