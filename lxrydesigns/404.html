<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — LXRY Designs</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#0D0D0D">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --accent-teal: #27F4D2; --dark-bg: #0D0D0D; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: #D4D8DA;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .mark { height: 120px; margin-bottom: 30px; }
        .code {
            font-family: 'Jura', sans-serif;
            font-size: 6rem;
            font-weight: 600;
            color: var(--accent-teal);
            letter-spacing: 8px;
            line-height: 1;
        }
        h1 { color: #fff; font-size: 1.6rem; margin: 18px 0 10px; }
        p { color: #AEB4B7; max-width: 460px; margin-bottom: 34px; line-height: 1.6; }
        a.home {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-teal), #7dfbe6);
            color: #000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.25s ease;
        }
        a.home:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <img src="assets/lxry-mark-solid.png" alt="LXRY Designs" class="mark">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you were looking for has moved or never existed. Let's get you back on track.</p>
    <a class="home" href="/">Back to home</a>
</body>
</html>
