[build]
  # Static site with blog build step. The site lives in the lxrydesigns/ subfolder,
  # so point Netlify's publish directory there (repo root has no index.html).
  publish = "lxrydesigns"
  command = "node scripts/build-blog.js"
  [build.environment]
    NODE_VERSION = "20"

# Serverless functions (newsletter signup → MailerLite). Node 20 has global fetch.
[functions]
  directory = "netlify/functions"

# Security headers — the same hygiene our audit checks on client sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; frame-src https://www.openstreetmap.org; connect-src 'self'; base-uri 'self'; form-action 'self' mailto: https://wa.me; frame-ancestors 'self'"

# Long-cache immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Clean URLs for the legal pages
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/brand-pack"
  to = "/brand-pack.html"
  status = 200

[[redirects]]
  from = "/ai-kit"
  to = "/ai-kit.html"
  status = 200

# ---- Operations Dashboard (admin) ----
# Page: /admin → admin.html. Not for search engines, never cached.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Admin API: on-demand function netlify/functions/admin-action.js (Task 2+).
# No schedule — invoked only by the dashboard.
[[redirects]]
  from = "/admin-check-password"
  to = "/.netlify/functions/admin-action/check-password"
  status = 200

[[redirects]]
  from = "/admin-action/*"
  to = "/.netlify/functions/admin-action/:splat"
  status = 200

# Scheduled function: AI content engine (Monday 9 AM UTC)
[[scheduled_functions]]
  name = "content-engine"
  schedule = "0 9 * * 1"
